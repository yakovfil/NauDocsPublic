<style>
	.custom-links {
		margin-top: 14px;
		margin-left: 14px; /* Adjust the left margin */
		margin-right: 14px;
		margin-bottom: 30px; /* Adjust the bottom margin */
		align-self: center;
	}
	.button {
		background-color: rgba(255, 255, 255, 0);
		border: 2px solid #AFB4C3;
		border-radius: 4px;
		color: #000000;
		padding: 10px 28px 10px 28px;
		text-align: center;
		text-decoration: none;
		display: inline-block;
		font-size: 16px;
		margin: 4px 1px;
		cursor: pointer;
	}
	

</style>
<head>
	<div class="custom-links">
		<a href="/docs/beta/api-doc/index.html" class="button">Документация API</a>
	</div>
	<script type="text/javascript">
		document.addEventListener('DOMContentLoaded', function() {
			function updateLinkColors() {
				const themeAttribute = document.body.getAttribute('data-theme');
				let theme;
				if (themeAttribute === 'auto') {
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					theme = prefersDark ? 'dark' : 'light';
				} else {
					theme = themeAttribute || 'light';
				}
				const links = document.querySelectorAll('.custom-links a');
				links.forEach(function(link) {
					if (theme === 'dark') {
						link.style.color = '#cfd0d0'; 
					} else {
						link.style.color = '#000000';
					}
				});
			}
			updateLinkColors();
			const observer = new MutationObserver(function(mutations) {
				mutations.forEach(function(mutation) {
					if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
						updateLinkColors();
					}
				});
			});
			observer.observe(document.body, {
				attributes: true,
			});
		});
	</script>
</head>
